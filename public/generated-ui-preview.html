<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generated UI asset preview</title>
  </head>
  <body style="margin:0;padding:32px;background:#02050d;color:#eefbff;font-family:system-ui,sans-serif">
    <main style="max-width:1120px;margin:0 auto">
      <h1 style="margin:0 0 8px;font-size:30px">Generated 2× PNG assets</h1>
      <p style="margin:0 0 28px;color:#9db2cf">Displayed at their intended CSS size. Checkerboards indicate transparency.</p>

      <section style="display:grid;gap:24px">
        <figure style="margin:0;padding:20px;border:1px solid #223456;background:#071020">
          <figcaption style="margin-bottom:14px;color:#8cecff">game-logo.png · 900×360 CSS px</figcaption>
          <div style="overflow:auto;background-color:#05070d;background-image:linear-gradient(45deg,#101726 25%,transparent 25%),linear-gradient(-45deg,#101726 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#101726 75%),linear-gradient(-45deg,transparent 75%,#101726 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0">
            <img src="/generated-ui/game-logo.png" alt="Chess Chess Revolution wordmark" style="display:block;width:900px;height:360px;max-width:none" />
          </div>
        </figure>

        <figure style="margin:0;padding:20px;border:1px solid #223456;background:#071020">
          <figcaption style="margin-bottom:14px;color:#8cecff">action-button-frame.png · 760×140 CSS px · text remains live</figcaption>
          <div style="position:relative;width:760px;height:140px;max-width:100%">
            <img src="/generated-ui/action-button-frame.png" alt="" style="position:absolute;inset:0;width:100%;height:100%" />
            <span style="position:absolute;inset:0;display:grid;place-items:center;color:#f4fbff;font-family:Impact,sans-serif;font-size:64px;font-style:italic;text-shadow:3px 5px #122964">PLAY</span>
          </div>
        </figure>

        <figure style="margin:0;padding:20px;border:1px solid #223456;background:#071020">
          <figcaption style="margin-bottom:14px;color:#8cecff">small-control-frame.png · 396×106 CSS px · text remains live</figcaption>
          <div style="position:relative;width:396px;height:106px">
            <img src="/generated-ui/small-control-frame.png" alt="" style="position:absolute;inset:0;width:100%;height:100%" />
            <span style="position:absolute;inset:0;display:flex;align-items:center;padding-left:38px;font-size:42px;font-weight:700">English</span>
          </div>
        </figure>

        <div style="display:grid;grid-template-columns:443px 512px;gap:24px;align-items:start">
          <figure style="margin:0;padding:20px;border:1px solid #223456;background:#071020">
            <figcaption style="margin-bottom:14px;color:#8cecff">settings-panel-frame.png · shown at ½ size</figcaption>
            <img src="/generated-ui/settings-panel-frame.png" alt="Angular settings panel" style="display:block;width:443.5px;height:510.5px;max-width:100%" />
          </figure>
          <figure style="margin:0;padding:20px;border:1px solid #223456;background:#071020">
            <figcaption style="margin-bottom:14px;color:#8cecff">arcade-screen-frame.png · shown at ½ size</figcaption>
            <div style="background-color:#05070d;background-image:linear-gradient(45deg,#101726 25%,transparent 25%),linear-gradient(-45deg,#101726 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#101726 75%),linear-gradient(-45deg,transparent 75%,#101726 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0">
              <img src="/generated-ui/arcade-screen-frame.png" alt="Transparent arcade cabinet overlay" style="display:block;width:512px;height:768px;max-width:100%" />
            </div>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
